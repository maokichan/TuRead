<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>TuRead</title>
    <!-- script-src 的 blob: = 插件代码经 Blob URL 动态 import（v1 只装官方插件，信任边界见 CONTRACTS §9） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; connect-src 'self' blob:; frame-src 'self' blob:; font-src 'self' data: blob:; worker-src 'self' blob:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
