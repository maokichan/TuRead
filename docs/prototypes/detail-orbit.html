    ① 汇聚   单击书卡 → 卡片作为共享元素，携带旋转自网格原位飞向视口中央（尺寸不变）。

    ③ 轨道带 卡片落位前后，若干**有宽度的三维平绶带**自无到有**渐显**（用户定：进场 =
             透明度过渡，不是描画扫掠），文字贴带面循环流转；近处掠过卡前、环到卡后
             被深度缓冲精确遮挡（参照 2024 巴黎奥运 Louise Michel 雕像绶带段）。
             卡片即雕像，环带即绶带。
             ⚠ 带面**不扭转**（用户定：扭转伤可读性）——带宽方向全程取轨道面法向。
             ⚠ 半径**上下短、中间长**（用户定）= 纺锤包络；倾角**同族微差**（用户定：
             全同太呆板），各占一条"纬道"（offY 拉开）互不冲突。
             ⚠ **文字不住在带上**（用户定）：带 = 纯形状；内容由**独立文字层**承载
             （贴带面 2px 的专属网格 + 透明文字纹理）→ 字重/字号/颜色直接控制
             （TEXT_WEIGHT / cfg.textPx / cssVar('--text')）。
    ④ 退出   Esc / 点击场外 → 原路反向：环带渐隐，卡片飞回原格，模糊松开。
             **opening 态可打断**（Esc/点击场外随时生效，从当前状态平滑收场）。

  渲染分工（2026-11-02 用户定：大胆上 3D）：
    - **聚焦舞台 = WebGL（three.js r187，MIT，与 AGPL-3.0 兼容）**——只有这一层是 3D：
      卡片平面 + 四条绶带曲面 + 文字层 + 深度缓冲遮挡。CSS 2.5D 平面投影画不出宽带曲面，已否。
    - **渲染器全局持久**（一次创建、反复复用、闲时隐藏）——每次开合新建/销毁 WebGL
      上下文会被浏览器回收（丢上下文 = 画面冻在模糊幕上，实机踩过）；场景内容逐次重建。
    - 页面其余一切（网格、景深幕、点击、主题）仍是 DOM/CSS；模糊幕垫在 canvas 之下照常工作。
    - three 以本地 ESM 文件随原型携带（lib/three.module.js + lib/three.core.js，npm 官方包原样拷贝，

  纪律：
    - 颜色/时长/曲线 = TuRead token（值镜像自 client/src/renderer/src/styles.css，
      本文件是探索原型，产品实现时回到真 token，不得从这里复制）。
    - 卡片尺寸全程不变（用户定：环带绕封面卡自转，不是"放大到舞台"）。
    - 操作接口预留：见 stage.actions —— 动画定稿后再裁形态与落点。
    - reduced-motion：去位移/自转/流转，静态一帧呈现焦点态；收场直接复位（弱化，不是归零）。

  打开方式：经本地静态服务器打开（three 是 ESM 模块，file:// 会被 CORS 拦）：
    cd docs/prototypes && python -m http.server 8392
    → http://127.0.0.1:8392/detail-orbit.html

/* cubic-bezier 采样（token 曲线进 JS 侧，与 CSS 同源） */
function bezier(p1x, p1y, p2x, p2y) {
  const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx
  const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by
  const fx = t => ((ax * t + bx) * t + cx) * t
  const dfx = t => (3 * ax * t + 2 * bx) * t + cx
  return u => {
    if (u <= 0) return 0
    if (u >= 1) return 1
    let t = u
    for (let i = 0; i < 6; i++) { const e = fx(t) - u; if (Math.abs(e) < 1e-5) break; t -= e / dfx(t) }
    return ((ay * t + by) * t + cy) * t
  }
}

const TUNE_KEY = 'turead-orbit-tuning-v1'
let bandConfigs = loadTuning() || DEFAULT_BANDS.map(b => ({ ...b }))
function loadTuning() {
  try {
    const arr = JSON.parse(localStorage.getItem(TUNE_KEY) || 'null')
    if (!Array.isArray(arr) || !arr.length) return null
    return arr.map(b => ({
      rx: b.rx, ry: b.ry, tiltX: b.tiltX, tiltZ: b.tiltZ,
      offY: b.offY, zOff: b.zOff || 0, w: b.w, dur: b.dur, textPx: b.textPx

  const m = book.meta
  return [`${m.last}　·　${m.progress}`, `${m.phy}　·　${m.time}`, m.desc, m.loc, `${m.progress}　·　${m.last}`]
}
function makeBands(book) {
  const texts = textsFor(book)
  return bandConfigs.map((cfg, i) => ({ ...cfg, text: texts[i % texts.length] }))
}

/* ======== 封面纹理（与 DOM 封面同语汇：panel-2 槽 + 1px 边 + 拟合标题） ======== */
function drawCoverTexture(w, h, title) {
  const s = 2                                     /* 2x 采样保清晰 */
  const cv = document.createElement('canvas')
  cv.width = w * s; cv.height = h * s
  const ctx = cv.getContext('2d')
  ctx.fillStyle = cssVar('--panel-2'); ctx.fillRect(0, 0, cv.width, cv.height)
  ctx.strokeStyle = cssVar('--border'); ctx.lineWidth = s
  ctx.strokeRect(s / 2, s / 2, cv.width - s, cv.height - s)
  /* 标题：贪心逐字折行（CJK），行数超限则降字号（FittedTitle 的原型替身） */
  let size = fitSize(title) * s
  let lines = []
  for (; size >= 18; size -= 2 * s) {
    ctx.font = `700 ${size}px ${FONT_STACK}`
    lines = []
    let line = ''
    for (const ch of title) {
      if (ctx.measureText(line + ch).width > cv.width - 20 * s && line) { lines.push(line); line = ch }
      else line += ch
    }
    if (line) lines.push(line)
    if (lines.length <= 4) break
  }
  ctx.fillStyle = cssVar('--text')
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  const lh = size * 1.35
  const y0 = cv.height / 2 - (lines.length - 1) * lh / 2
  lines.forEach((ln, i) => ctx.fillText(ln, cv.width / 2, y0 + i * lh))
  const tex = new THREE.CanvasTexture(cv)
  tex.colorSpace = THREE.SRGBColorSpace
  tex.anisotropy = 4
  return tex
}

/* ======== 文字层纹理（**内容承载层**，用户定：与带分离） ========
   透明底 + 一段墨字（整周期画布）；字重/字号/颜色在此直接控制 ——
   textPx = 世界字高（canvas 字号按 带宽/worldW 换算，四条带字高一致）；
   返回 repeat.x（沿轨道的整周期数 —— 闭环无缝的充要条件）。 */
const TEXT_WEIGHT = 700                              /* 文字层字重（直接控制点） */
const TEXT_GAP = '　　'                               /* 周期间距（两个全宽空格） */
function drawBandTextTexture(text, worldW, circumference, textPx) {
  const CH = 256                                     /* 画布高（2x 超采样于 128 基准） */
  const fontPx = Math.max(12, (textPx / worldW) * CH)
  const probe = document.createElement('canvas').getContext('2d')
  probe.font = `${TEXT_WEIGHT} ${fontPx}px ${FONT_STACK}`
  try { probe.letterSpacing = '1px' } catch {}
  const periodCanvas = Math.max(64, probe.measureText(text + TEXT_GAP).width)
  const cv = document.createElement('canvas')
  cv.width = Math.round(periodCanvas); cv.height = CH
  const ctx = cv.getContext('2d')
  ctx.font = `${TEXT_WEIGHT} ${fontPx}px ${FONT_STACK}`
  try { ctx.letterSpacing = '1px' } catch {}
  ctx.fillStyle = cssVar('--text')
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'
  ctx.fillText(text + TEXT_GAP, 0, CH / 2 + 2)
  const tex = new THREE.CanvasTexture(cv)
  tex.colorSpace = THREE.SRGBColorSpace
  tex.wrapS = THREE.RepeatWrapping
  tex.anisotropy = 8
  const periodWorld = (periodCanvas / CH) * worldW   /* 画布周期 → 世界周期 */
  const n = Math.max(1, Math.round(circumference / periodWorld))
  tex.repeat.set(n, 1)
  return { tex, n }
}

/* 椭圆周长（Ramanujan 近似）—— 文字平铺周期数的换算依据 */
function ellipseCircumference(rx, ry) {
  const h = ((rx - ry) * (rx - ry)) / ((rx + ry) * (rx + ry))
  return Math.PI * (rx + ry) * (1 + 3 * h / (10 + Math.sqrt(4 - 3 * h)))
}

/* ======== 绶带几何（倾斜椭圆轨道上扫出的平带；带宽方向全程不变） ========
   faceOffset = 沿面法向的外移量（文字层 = 2，浮在带面之上避免 z-fighting） */
function buildBandGeometry(cfg, faceOffset = 0) {
  const SEG = 220
  const pos = [], uv = [], idx = [], norm = []
  const euler = new THREE.Euler(THREE.MathUtils.degToRad(cfg.tiltX), 0, THREE.MathUtils.degToRad(cfg.tiltZ), 'XYZ')
  const q = new THREE.Quaternion().setFromEuler(euler)
  const p = new THREE.Vector3(), t = new THREE.Vector3()
  const w = new THREE.Vector3(), nrm = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3()
  const offY = -cfg.offY                              /* px 的"下移"换成 three 的 y-up */
  for (let i = 0; i <= SEG; i++) {
    const th = (i / SEG) * Math.PI * 2
    /* 轨道点与切向（平面内椭圆），随后整体按姿态四元数转动；zOff = 轨道中心前后平移 */
    p.set(cfg.rx * Math.cos(th), cfg.ry * Math.sin(th), 0).applyQuaternion(q)
    if (cfg.zOff) p.z += cfg.zOff
    t.set(-cfg.rx * Math.sin(th), cfg.ry * Math.cos(th), 0).normalize().applyQuaternion(q)
    w.set(0, 0, 1).applyQuaternion(q)                 /* 带宽方向 = 轨道面法向，全程不变（平绶带） */
    nrm.copy(t).cross(w).normalize()
    if (faceOffset) p.addScaledVector(nrm, faceOffset)
    a.copy(p).addScaledVector(w, -cfg.w / 2); a.y += offY
    b.copy(p).addScaledVector(w, cfg.w / 2); b.y += offY
    pos.push(a.x, a.y, a.z, b.x, b.y, b.z)
    norm.push(nrm.x, nrm.y, nrm.z, nrm.x, nrm.y, nrm.z)
    uv.push(i / SEG, 0, i / SEG, 1)
  }
  for (let i = 0; i < SEG; i++) {
    const k = i * 2
    idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2)
  }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3))
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2))
  g.setIndex(idx)
  return g
}

/* ======== 持久 GL（渲染器一次创建、反复复用、闲时隐藏 —— 上下文反复创建会被浏览器回收） ======== */
const FOCV = 40                                     /* fov */
let GL = null                                       /* { root, canvas, renderer, camera } */
function ensureGL() {
  if (GL) return GL
  const root = document.createElement('div')
  root.className = 'gl-stage'
  const canvas = document.createElement('canvas')
  root.appendChild(canvas)
  document.body.appendChild(root)
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true })
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
  const camera = new THREE.PerspectiveCamera(FOCV, 1, 10, 8000)
  GL = { root, canvas, renderer, camera }
  return GL
}
function camDistFor(vh) { return (vh / 2) / Math.tan(THREE.MathUtils.degToRad(FOCV / 2)) }
function sizeGL(gl, vw, vh) {
  gl.renderer.setSize(vw, vh)
  gl.camera.aspect = vw / vh
  gl.camera.updateProjectionMatrix()
}

/* ======== 场景内容（每次聚焦重建；1 世界单位 = 1 css px @ z=0 平面） ======== */
function buildScene(book, rect, vw, vh) {
  const scene = new THREE.Scene()

  /* 光：环境光为主（平绶带不需要明暗戏剧）；方向光弱背光（远弧略暗 = 深度线索） */
  scene.add(new THREE.AmbientLight(0xffffff, 2.3))
  const dir = new THREE.DirectionalLight(0xffffff, 0.55)
  dir.position.set(0, 300, 800)
  scene.add(dir)

  /* 卡片（共享元素；尺寸全程不变） */
  const card = new THREE.Mesh(
    new THREE.PlaneGeometry(rect.width, rect.height),
    new THREE.MeshBasicMaterial({ map: drawCoverTexture(rect.width, rect.height, book.title) })
  )
  card.position.set(rect.left + rect.width / 2 - vw / 2, vh / 2 - (rect.top + rect.height / 2), 0)
  scene.add(card)

  /* 卡影：卡片背后的软暗晕（把卡从远侧绶带里剥出来；跟随卡片补间移动） */
  const shadowCv = document.createElement('canvas')
  shadowCv.width = 256; shadowCv.height = 256
  {
    const ctx = shadowCv.getContext('2d')
    const g = ctx.createRadialGradient(128, 128, 20, 128, 128, 126)
    g.addColorStop(0, 'rgba(0,0,0,0.6)')
    g.addColorStop(0.55, 'rgba(0,0,0,0.3)')
    g.addColorStop(1, 'rgba(0,0,0,0)')
    ctx.fillStyle = g
    ctx.fillRect(0, 0, 256, 256)
  }
  const shadowTex = new THREE.CanvasTexture(shadowCv)
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(rect.width * 1.75, rect.height * 1.55),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
  )
  shadow.position.set(card.position.x, card.position.y, -40)
  scene.add(shadow)

  /* 绶带：带 = 纯形状（纯色面，无纹理）；文字 = 独立承载层（贴面 2px，透明纹理）。
     两者透明度都从 0 起（用户定：绶带从无到有渐显）。 */
  const bands = makeBands(book).map(cfg => {
    const b = makeBandObjects(cfg)
    scene.add(b.bandMesh); scene.add(b.textMesh)
    return b
  })

  return { scene, card, shadow, bands, book }
}

/* 单条绶带的全部对象（buildScene 与調參面板的实时重建共用同一构造） */
function makeBandObjects(cfg) {
  const bandMat = new THREE.MeshLambertMaterial({
    color: cssVar('--panel'), side: THREE.DoubleSide, transparent: true, opacity: 0
  })
  const bandMesh = new THREE.Mesh(buildBandGeometry(cfg), bandMat)

  const C = ellipseCircumference(cfg.rx, cfg.ry)
  const { tex } = drawBandTextTexture(cfg.text, cfg.w, C, cfg.textPx)
  const textMat = new THREE.MeshBasicMaterial({
    map: tex, side: THREE.DoubleSide, transparent: true, opacity: 0, depthWrite: false
  })
  const textMesh = new THREE.Mesh(buildBandGeometry(cfg, 2), textMat)

  return { cfg, bandMesh, bandMat, textMesh, textMat, tex }
}

/* 主题/字号变化 → 重建（颜色唯一来源仍是 CSS 变量；带色与文字层都随主题） */
function refreshStage(s) {
  s.card.material.map.dispose()
  s.card.material.map = drawCoverTexture(s.card.geometry.parameters.width, s.card.geometry.parameters.height, s.book.title)
  s.card.material.needsUpdate = true
  s.bands.forEach(b => {
    b.bandMat.color.set(cssVar('--panel'))
    b.tex.dispose()
    const C = ellipseCircumference(b.cfg.rx, b.cfg.ry)
    b.tex = drawBandTextTexture(b.cfg.text, b.cfg.w, C, b.cfg.textPx).tex
    b.textMat.map = b.tex
    b.textMat.needsUpdate = true
  })
  if (reduceMotion.matches) s.gl.renderer.render(s.scene, s.gl.camera)   /* 静态帧重画一次 */
}

/* 场景资源释放（几何/材质/纹理；渲染器持久不释放） */
function disposeScene(s) {
  s.scene.traverse(o => {
    if (o.geometry) o.geometry.dispose()
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material]
      ms.forEach(m => { if (m.map) m.map.dispose(); m.dispose() })
    }
  })
}

/* ======== 舞台主循环（唯一 rAF：补间 + 文字流转 + 渲染；K() 每帧现读 → 慢速实时生效） ======== */
function addTween(s, tw) {
  tw.p = 0
  tw.t0 = 0                                      /* 首帧落墙钟（进度 = 真实时间，见下） */
  tw.k0 = K()                                    /* 速度因子在补间开始时定格 */
  s.tweens.push(tw)
}

function startLoop(s) {
  let last = performance.now()
  const step = (tms) => {
    if (stage !== s) return                       /* 已拆台 → 循环自然终止 */
    try {
      const k = K()
      const dt = Math.min(64, tms - last); last = tms
      /* 进度走墙钟（tms - t0），不走逐帧 dt 累加 —— rAF 被节流/冻结时 dt=0 会把
         补间永久卡在半途（实机踩过：closing 挂死在模糊幕上）；墙钟进度在冻结恢复后
         一次性补完，永不挂死。慢速因子在补间开始时定格（k0）。 */
      s.tweens = s.tweens.filter(tw => {
        if (tw.p >= 1) return false
        if (!tw.t0) tw.t0 = tms
        tw.p = Math.min(1, (tms - tw.t0) / (tw.dur * tw.k0))
        tw.fn((tw.ease || (x => x))(tw.p))
        return tw.p < 1
      })
      /* 文字沿轨道流转（offset 0→1 = 恰好一整圈 → 无缝循环） */
      s.bands.forEach(b => { b.tex.offset.x = (b.tex.offset.x + dt / 1000 / (b.cfg.dur * k)) % 1 })
      s.gl.renderer.render(s.scene, s.gl.camera)
      if (state === 'closing') {
        if (!s.closeT0) s.closeT0 = tms
        /* 看门狗：收场 3s 内必须归位（墙钟补间已保证；此处兜底未知环境因素） */
        if (s.tweens.length === 0 || tms - s.closeT0 > 3000) { finishClose(s); return }
      } else {
        s.closeT0 = 0
      }
    } catch (err) {
      /* 循环永不带病运行：任何异常 → 记录 + 强制复位回网格（用户绝不被困在模糊幕上） */
      window.__boot.push('LOOP ' + String(err && err.stack || err))
      forceTeardown(s)
      return
    }
    s.raf = requestAnimationFrame(step)
  }
  s.raf = requestAnimationFrame(step)
}

/* ======== 舞台拆装 ======== */
function finishClose(s) {
  s.timers.forEach(clearTimeout)
  const sc = document.querySelector('.scrim')
  if (sc) sc.remove()
  if (lastTrigger) lastTrigger.el.style.visibility = ''
  disposeScene(s)
  s.gl.root.style.display = 'none'
  stage = null
  state = 'idle'
}
function forceTeardown(s) {                        /* 异常兜底：无条件回到网格 */
  try { disposeScene(s) } catch {}
  finishClose(s)
}

/* ======== 聚焦舞台状态机：idle → opening → focused → closing（opening 可打断） ======== */
let state = 'idle'
let stage = null
let lastTrigger = null

function openFocus(cardEl, book, index) {
  if (state !== 'idle') return
  state = 'opening'
  lastTrigger = { el: cardEl, book, index }

  const rect = cardEl.querySelector('.cover').getBoundingClientRect()
  cardEl.style.visibility = 'hidden'

  const vw = innerWidth, vh = innerHeight
  const gl = ensureGL()
  gl.root.style.display = ''
  sizeGL(gl, vw, vh)
  const camDist = camDistFor(vh)
  gl.camera.position.set(0, 0, camDist)

  const content = buildScene(book, rect, vw, vh)
  stage = {
    gl, ...content, camDist,
    tweens: [], timers: [], raf: 0,
    actions: null,                                  /* 预留：操作接口（动画定稿后裁） */
  }
  const s = stage

  buildScrim()

  if (reduceMotion.matches) {
    /* 弱化：不飞不转不流转，静态一帧呈现焦点态（颜色与层次保留）；收场直接复位 */
    s.card.position.set(0, 0, 0)
    s.shadow.position.set(0, 0, -40)
    s.bands.forEach(b => { b.bandMat.opacity = 1; b.textMat.opacity = 1 })
    gl.renderer.render(s.scene, s.camera)
    state = 'focused'
    return
  }

  const sx = rect.left + rect.width / 2 - vw / 2, sy = vh / 2 - (rect.top + rect.height / 2)

  /* ① 飞行：位移（强 ease-out）+ 旋转（ease-in-out），落点即焦点 */
  addTween(s, { dur: 460, ease: easeOutT, fn: t => {
    s.card.position.set(sx * (1 - t), sy * (1 - t), 0)
    s.shadow.position.set(s.card.position.x, s.card.position.y, -40)
  } })
  addTween(s, { dur: 460, ease: easeInOutT, fn: t => { s.card.rotation.y = t * Math.PI * 2 } })
  /* ③ 绶带：从无到有**渐显**（用户定；错峰 120ms），文字层稍后跟进显影 */
  s.bands.forEach((b, i) => {
    s.timers.push(setTimeout(() => {
      if (stage !== s || state === 'closing' || state === 'idle') return
      addTween(s, { dur: 450, ease: easeOutT, fn: t => { b.bandMat.opacity = t } })
    }, (240 + i * 120) * K()))
    s.timers.push(setTimeout(() => {
      if (stage !== s || state === 'closing' || state === 'idle') return
      addTween(s, { dur: 350, ease: easeOutT, fn: t => { b.textMat.opacity = t } })
    }, (400 + i * 120) * K()))
  })
  s.timers.push(setTimeout(() => { if (state === 'opening') state = 'focused' }, 480 * K()))
  startLoop(s)
}

function buildScrim() {
  const scrim = document.createElement('div')
  scrim.className = 'scrim'
  document.body.appendChild(scrim)
  scrim.getBoundingClientRect()          /* 强制布局：过渡起点就绪，不依赖 rAF（后台节流也生效） */
  scrim.classList.add('on')
  scrim.addEventListener('click', closeFocus)
  return scrim
}

function closeFocus() {
  if (!stage || (state !== 'focused' && state !== 'opening')) return
  const s = stage
  state = 'closing'
  s.timers.forEach(clearTimeout); s.timers = []

  const sc = document.querySelector('.scrim')
  if (sc) { sc.classList.add('closing'); sc.classList.remove('on') }

  if (reduceMotion.matches) { finishClose(s); return }

  /* 回原格：现场重测（窗口在聚焦期间可能变过尺寸）；从**当前**状态平滑收场（可打断） */
  const rect = lastTrigger.el.querySelector('.cover').getBoundingClientRect()
  const vw = innerWidth, vh = innerHeight
  const sx = rect.left + rect.width / 2 - vw / 2, sy = vh / 2 - (rect.top + rect.height / 2)

  s.tweens = []                                    /* 打断进行中的补间，改从现场状态接管 */
  const px = s.card.position.x, py = s.card.position.y, rz = s.card.rotation.y
  addTween(s, { dur: 300, ease: easeOutT, fn: t => {
    s.card.position.set(px + (sx - px) * t, py + (sy - py) * t, 0)
    s.shadow.position.set(s.card.position.x, s.card.position.y, -40)
  } })
  addTween(s, { dur: 300, ease: easeInOutT, fn: t => { s.card.rotation.y = rz * (1 - t) } })
  s.bands.forEach(b => {
    ;[b.bandMat, b.textMat].forEach(m => {
      const op0 = m.opacity
      if (op0 <= 0) { m.opacity = 0; return }
      addTween(s, { dur: 180, ease: easeOutT, fn: t => { m.opacity = op0 * (1 - t) } })
    })
  })
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFocus() })

/* 复查诊断钩子（原型专用） */
window.__protoState = () => ({ state, hasStage: !!stage, scrims: document.querySelectorAll('.scrim').length })

/* ======== 原型旋钮 ======== */
const THEMES = ['dark', 'light', 'sepia-light', 'sepia-dark']
const THEME_NAMES = { dark: '純色·深', light: '純色·淺', 'sepia-light': '羊皮紙·淺', 'sepia-dark': '羊皮紙·深' }
let themeIdx = 0
document.getElementById('btnTheme').addEventListener('click', e => {
  themeIdx = (themeIdx + 1) % THEMES.length
  document.documentElement.dataset.theme = THEMES[themeIdx]
  if (stage) { try { refreshStage(stage) } catch (err) { window.__boot.push('THEME ' + String(err)) } }
  e.currentTarget.textContent = '主題 · ' + THEME_NAMES[THEMES[themeIdx]]
})
let slow = false
document.getElementById('btnSlow').addEventListener('click', e => {
  slow = !slow
  document.documentElement.style.setProperty('--k', slow ? '4' : '1')
  e.currentTarget.dataset.on = slow ? '1' : '0'
})
document.getElementById('btnReplay').addEventListener('click', () => {
  if (state === 'idle') {
    if (lastTrigger) openFocus(lastTrigger.el, lastTrigger.book, lastTrigger.index)
    return
  }
  const t = lastTrigger
  if (!t) return
  closeFocus()
  let n = 0
  const wait = setInterval(() => {                 /* 收场完再开（时长随慢速因子可变，轮询而非定时） */
    if (state === 'idle') { clearInterval(wait); openFocus(t.el, t.book, t.index) }
    else if (++n > 80) clearInterval(wait)
  }, 50)
})

/* ======== 調參面板（原型工具；产品不得保留） ======== */
const panel = document.createElement('aside')
panel.className = 'tune-panel'
document.body.appendChild(panel)

let rebuildQueued = false
function queueBandRebuild() {                       /* 拖动滑杆 → 每帧至多重建一次 */
  if (rebuildQueued || !stage) return
  rebuildQueued = true
  requestAnimationFrame(() => {
    rebuildQueued = false
    if (!stage) return
    rebuildBandMeshes(stage)
    if (reduceMotion.matches) stage.gl.renderer.render(stage.scene, stage.gl.camera)
  })
}
function rebuildBandMeshes(s) {                     /* 按当前 bandConfigs 重建全部绶带对象（保留现场透明度） */
  const oldOp = s.bands.map(b => [b.bandMat.opacity, b.textMat.opacity])
  s.bands.forEach(b => {
    s.scene.remove(b.bandMesh); s.scene.remove(b.textMesh)
    b.bandMesh.geometry.dispose(); b.bandMat.dispose()
    b.textMesh.geometry.dispose(); if (b.textMat.map) b.textMat.map.dispose(); b.textMat.dispose()
  })
  s.bands = makeBands(s.book).map(cfg => {
    const b = makeBandObjects(cfg)
    s.scene.add(b.bandMesh); s.scene.add(b.textMesh)
    return b
  })
  s.bands.forEach((b, i) => {
    const op = oldOp[i] || [1, 1]
    b.bandMat.opacity = op[0]; b.textMat.opacity = op[1]
  })
}

const TUNE_ROWS = [
  ['水平半徑 rx', 'rx', 120, 520, 2], ['縱向半徑 ry', 'ry', 60, 320, 2],
  ['傾角 tiltX', 'tiltX', 30, 85, 1], ['扭向 tiltZ', 'tiltZ', -20, 20, 1],
  ['高度 offY', 'offY', -260, 260, 2], ['前後 zOff', 'zOff', -140, 140, 2],
  ['寬 w', 'w', 16, 90, 1], ['轉速 dur', 'dur', 8, 40, 1], ['字高 textPx', 'textPx', 10, 24, 1],
]
function renderPanel() {
  panel.innerHTML = ''
  const h = document.createElement('h2'); h.textContent = '綬帶調參'
  const hint = document.createElement('p'); hint.className = 'tune-hint'
  hint.textContent = '聚焦一張書卡後拖動即時生效；配置自動留存（重開頁面仍在）。調好後「導出配置」把 JSON 發給助手固化為默認值。'
  panel.append(h, hint)
  const actions = document.createElement('div'); actions.className = 'tune-actions'
  const mkBtn = (text, fn) => { const b = document.createElement('button'); b.className = 'proto-btn'; b.textContent = text; b.addEventListener('click', fn); return b }
  actions.append(
    mkBtn('＋加帶', () => { bandConfigs.push({ ...(bandConfigs[bandConfigs.length - 1] || DEFAULT_BANDS[0]) }); saveTuning(); renderPanel(); if (stage) rebuildBandMeshes(stage) }),
    mkBtn('－減帶', () => { if (bandConfigs.length > 1) { bandConfigs.pop(); saveTuning(); renderPanel(); if (stage) rebuildBandMeshes(stage) } }),
    mkBtn('導出配置', exportConfig),
    mkBtn('重置默認', () => { bandConfigs = DEFAULT_BANDS.map(b => ({ ...b })); saveTuning(); renderPanel(); if (stage) rebuildBandMeshes(stage) }),
  )
  panel.appendChild(actions)
  bandConfigs.forEach((cfg, i) => panel.appendChild(bandSection(i)))
}
function bandSection(i) {
  const cfg = bandConfigs[i]
  const div = document.createElement('div'); div.className = 'tune-band'
  const h3 = document.createElement('h3')
  h3.append(`帶 ${i + 1}`)
  const rm = document.createElement('button'); rm.className = 'proto-btn tune-remove'; rm.textContent = '移除'
  rm.addEventListener('click', () => { if (bandConfigs.length > 1) { bandConfigs.splice(i, 1); saveTuning(); renderPanel(); if (stage) rebuildBandMeshes(stage) } })
  h3.appendChild(rm); div.appendChild(h3)
  TUNE_ROWS.forEach(([label, key, min, max, step]) => {
    const row = document.createElement('div'); row.className = 'tune-row'
    const lab = document.createElement('label'); lab.textContent = label
    const inp = document.createElement('input'); inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = cfg[key]
    const out = document.createElement('output'); out.textContent = cfg[key]
    inp.addEventListener('input', () => {
      cfg[key] = parseFloat(inp.value); out.textContent = inp.value; saveTuning(); queueBandRebuild()
    })
    row.append(lab, inp, out); div.appendChild(row)
  })
  return div
}
function exportConfig() {                           /* 导出当前配置 JSON（复制给助手固化） */
  const ov = document.createElement('div')
  ov.style.cssText = 'position:fixed;inset:0;z-index:80;background:rgb(0 0 0 / .4);display:flex;align-items:center;justify-content:center'
  const box = document.createElement('div')
  box.style.cssText = 'background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-panel);padding:16px;width:440px;box-shadow:var(--shadow-modal)'
  const p = document.createElement('p'); p.style.cssText = 'margin:0 0 8px;font-size:12.5px'
  p.textContent = '当前绶带配置（复制发给助手即可固化为默认值）：'
  const ta = document.createElement('textarea')
  ta.style.cssText = 'width:100%;height:180px;background:var(--input-bg);color:var(--text);border:1px solid var(--border);font:12px/1.5 var(--font-ui);user-select:text'
  ta.value = JSON.stringify(bandConfigs)
  const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:16px;margin-top:10px'
  const copy = document.createElement('button'); copy.className = 'proto-btn'; copy.textContent = '複製'
  copy.addEventListener('click', async () => {
    ta.select()
    let ok = false
    try { await navigator.clipboard.writeText(ta.value); ok = true } catch { try { ok = document.execCommand('copy') } catch {} }
    copy.textContent = ok ? '已複製' : '請手動複製'
  })
  const close = document.createElement('button'); close.className = 'proto-btn'; close.textContent = '關閉'
  close.addEventListener('click', () => ov.remove())
  row.append(copy, close); box.append(p, ta, row); ov.appendChild(box); document.body.appendChild(ov)
  ta.focus(); ta.select()
}
document.getElementById('btnTune').addEventListener('click', () => {
  panel.classList.toggle('on')
  if (panel.classList.contains('on')) renderPanel()
})

addEventListener('resize', () => {
  if (!GL) return
  sizeGL(GL, innerWidth, innerHeight)
  if (stage) {
    stage.camDist = camDistFor(innerHeight)
    stage.gl.camera.position.z = stage.camDist
    if (reduceMotion.matches) stage.gl.renderer.render(stage.scene, stage.gl.camera)
  }
})
</script>
</body>
